services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lishuiwan
      MYSQL_USER: lishuiwan
      MYSQL_PASSWORD: lishuiwan_dev
      MYSQL_ROOT_PASSWORD: lishuiwan_root_dev
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+08:00"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_dev_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plishuiwan_root_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "lishuiwan_dev"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_dev_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "lishuiwan_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_dev_data: {}
  redis_dev_data: {}
