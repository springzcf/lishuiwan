server:
  port: ${SERVER_PORT:80}
  shutdown: graceful
  forward-headers-strategy: framework
spring:
  application:
    name: lishuiwan-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQL_ADDRESS:localhost:3306}/${MYSQL_DATABASE:lishuiwan}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:${MYSQL_USERNAME:lishuiwan}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:change-me}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    com.lishuiwan: INFO
lishuiwan:
  mock-payment-enabled: ${MOCK_PAYMENT_ENABLED:false}
  dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  jwt:
    # 云托管首次部署可复用平台注入的数据库密码；正式运营建议单独设置 JWT_SECRET。
    secret: ${JWT_SECRET:lishuiwan-wxcloud-derived-jwt-secret-${MYSQL_PASSWORD:replace-with-at-least-32-random-bytes}}
    member-expire-seconds: ${JWT_MEMBER_EXPIRE:604800}
    admin-expire-seconds: ${JWT_ADMIN_EXPIRE:7200}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    verify-template-id: ${WECHAT_VERIFY_TEMPLATE_ID:}
    issue-template-id: ${WECHAT_ISSUE_TEMPLATE_ID:}
    template-thing-key: ${WECHAT_TEMPLATE_THING_KEY:thing1}
    template-time-key: ${WECHAT_TEMPLATE_TIME_KEY:time2}
    official-account:
      enabled: ${WECHAT_OFFICIAL_ENABLED:false}
      app-id: ${WECHAT_OFFICIAL_APP_ID:}
      app-secret: ${WECHAT_OFFICIAL_APP_SECRET:}
      oauth-callback-url: ${WECHAT_OFFICIAL_OAUTH_CALLBACK_URL:}
      h5-base-url: ${H5_BASE_URL:}
    pay:
      enabled: ${WECHAT_PAY_ENABLED:false}
      merchant-id: ${WECHAT_PAY_MCH_ID:}
      merchant-serial-number: ${WECHAT_PAY_SERIAL_NO:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:}
  upload:
    directory: ${UPLOAD_DIR:./data/uploads}
    url-prefix: ${UPLOAD_URL_PREFIX:/static/}
    max-bytes: ${UPLOAD_MAX_BYTES:5242880}
