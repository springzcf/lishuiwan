services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lishuiwan
      MYSQL_USER: lishuiwan
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_0900_ai_ci","--default-time-zone=+08:00"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck: {test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"], interval: 10s, timeout: 5s, retries: 10}
    networks: [internal]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD}"]
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], interval: 10s, timeout: 5s, retries: 10}
    networks: [internal]
  api:
    build: ./lishuiwan-api
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lishuiwan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: lishuiwan
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/data/uploads
      UPLOAD_URL_PREFIX: /static/
    volumes: ["uploads:/app/data/uploads", "./secrets:/run/secrets:ro"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"], interval: 15s, timeout: 5s, retries: 10}
    networks: [internal]
  web:
    build:
      context: .
      dockerfile: admin-web/Dockerfile
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    volumes: ["uploads:/data/static:ro"]
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
networks: {internal: {}}
volumes: {mysql_data: {}, redis_data: {}, uploads: {}}
